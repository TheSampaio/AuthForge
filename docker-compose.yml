services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: authforge
      POSTGRES_USER: authforge
      POSTGRES_PASSWORD: authforge
    ports:
      - "5432:5432"
    volumes:
      - authforge-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U authforge -d authforge"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: "Host=db;Port=5432;Database=authforge;Username=authforge;Password=authforge"
      # Set your own values for local Docker use; never commit real secrets.
      JwtSettings__SecretKey: ${JWT_SECRET_KEY:?Set JWT_SECRET_KEY in your shell or a .env file}
      CryptoSettings__Pepper: ${CRYPTO_PEPPER:?Set CRYPTO_PEPPER in your shell or a .env file}

volumes:
  authforge-db-data:
